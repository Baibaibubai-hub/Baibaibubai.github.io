---
layout: default
---

<style>
  body {
    background-color: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .container {
    max-width: 680px;
    margin: 40px auto;
    padding: 0 16px;
  }

  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    padding: 28px 24px;
    margin-bottom: 24px;
  }

  .tag {
    display: inline-block;
    background: #e6f7f5;
    color: #0d9488;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    color: #1e293b;
    margin: 0 0 12px 0;
  }

  .desc {
    background: #f1f5f9;
    border-left: 4px solid #0d9488;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    color: #475569;
    font-size: 15px;
    margin-bottom: 24px;
  }

  .post-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #1e293b;
    font-size: 17px;
    font-weight: 500;
    padding: 12px 0;
  }

  .post-link:hover {
    color: #0d9488;
  }

  .post-tag {
    display: inline-block;
    background: #f1f5f9;
    color: #64748b;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    margin-top: 8px;
  }

  .footer {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-top: 40px;
    padding-bottom: 40px;
  }

  .footer a {
    color: #0d9488;
    text-decoration: none;
    margin: 0 8px;
  }
</style>

<div class="container">
  <div class="card">
    <div class="tag">🔒 零日 · 运维</div>
    <h1 class="title">我的网络安全博客</h1>
    <div class="desc">
      📡 记录攻防技术 · 渗透笔记 · 安全思考
    </div>

    {% for post in site.posts limit:1 %}
      <a href="{{ post.url | relative_url }}" class="post-link">
        📄 点击查看我的第一个帖子
      </a >
      <div class="post-tag">首发 · {{ post.date | date: "%Y" }}</div>
    {% endfor %}
  </div>

  <div class="footer">
    🛡️ 保持好奇 · 保持怀疑
    <br><br>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a > · <a href="#">关于</a >
  </div>
</div>
